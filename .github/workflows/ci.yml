name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Discover-mode runs every tests/test_*.py file, so adding a new
      # test module (like tests/test_polymarket_ingestion.py) doesn't
      # require also editing this workflow. Reviewer caught that the
      # explicit per-file invocations meant new test files passed CI
      # green even when locally broken.
      - name: Run full unittest suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
